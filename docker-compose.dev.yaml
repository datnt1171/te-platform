services:
  devcontainer:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    container_name: devcontainer
    volumes:
      - .:/workspace:cached
      - vscode-extensions:/root/.vscode-server
    command: sleep infinity
    networks:
      - dev_network
    stdin_open: true
    tty: true
    depends_on:
      - db
      - redis

  backend:
    build:
      context: ./backend
      target: dev
    container_name: backend_dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - dev_network

  celery_worker:
    build:
      context: ./backend
      target: dev
    container_name: celery_worker_dev
    restart: unless-stopped
    command: celery -A task_management worker --loglevel=debug
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - dev_network

  redis:
    image: redis:8.0-alpine
    container_name: redis_dev
    ports:
      - "6379:6379"
    networks:
      - dev_network

  dw:
    build:
      context: ./dw
      target: dev
    container_name: fastapi_dw_dev
    restart: unless-stopped
    volumes:
      - ./dw:/app
      - ./dw/media:/app/media
    env_file:
      - ./dw/.env
    ports:
      - "8001:8001"
    depends_on:
      - db
    networks:
      - dev_network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: frontend_dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dev_network

  nginx:
    image: nginx:alpine
    container_name: nginx_dev
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/media:/media
      - ./dw/media:/dw-media
    depends_on:
      - backend
      - frontend
      - dw
    networks:
      - dev_network

  db:
    image: postgres:15
    container_name: postgres_dev
    restart: always
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data_dev:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - dev_network
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-dev
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - dev_network

volumes:
  db_data_dev:
  redis_data_dev:
  vscode-extensions:

networks:
  dev_network:
    name: dev_network
    driver: bridge